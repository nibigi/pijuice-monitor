<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>PiJuice Monitor — Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: system-ui, sans-serif;
            background: #f3f5f9;
            color: #172033;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px #17203312;
        }
        h1 { margin: 0 0 8px; font-size: 25px; }
        p { color: #64748b; margin-bottom: 28px; }
        label { display: block; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font: inherit;
            cursor: pointer;
        }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>PiJuice Monitor</h1>
        <p>Sign in to your dashboard</p>

        {% if error %}
        <p class="error" role="alert">Invalid password</p>
        {% endif %}

        <form method="post" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" autocomplete="current-password"
                   required autofocus>
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
